<svg width="100%" height="300" viewBox="0 0 1000 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05060C"/>
      <stop offset="55%" stop-color="#0B0F22"/>
      <stop offset="100%" stop-color="#160A16"/>
    </linearGradient>

    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF4D4D"/>
      <stop offset="50%" stop-color="#E4212B"/>
      <stop offset="100%" stop-color="#C4121C"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0; 1 0; -1 0" dur="7s" repeatCount="indefinite"/>
    </linearGradient>

    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="blurGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="50"/>
    </filter>

    <pattern id="halftone" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="7" r="1.4" fill="#38BDF8" opacity="0.35"/>
    </pattern>
  </defs>

  <rect width="1000" height="300" fill="url(#bgGrad)"/>

  <!-- ambient glows -->
  <circle cx="120" cy="240" r="130" fill="#DC2626" opacity="0.22" filter="url(#blurGlow)"/>
  <circle cx="880" cy="60" r="120" fill="#2563EB" opacity="0.28" filter="url(#blurGlow)"/>

  <!-- halftone comic texture corner -->
  <rect x="0" y="0" width="230" height="120" fill="url(#halftone)" opacity="0.5"/>

  <!-- radial spider web, anchored top-right -->
  <g stroke="#93C5FD" opacity="0.22">
    <path d="M 1000 -30 L 560 300" fill="none" stroke-width="1.2"/>
    <path d="M 1000 -30 L 720 300" fill="none" stroke-width="1.2"/>
    <path d="M 1000 -30 L 880 300" fill="none" stroke-width="1.2"/>
    <path d="M 1000 -30 L 1000 300" fill="none" stroke-width="1.2"/>
    <path d="M 1000 -30 L 400 180" fill="none" stroke-width="1.2"/>
    <path d="M 1000 -30 L 300 40" fill="none" stroke-width="1.2"/>
    <path d="M 700 130 Q 830 100 1000 130" fill="none" stroke-width="1"/>
    <path d="M 560 210 Q 780 160 1000 210" fill="none" stroke-width="1"/>
    <path d="M 420 270 Q 720 220 1000 270" fill="none" stroke-width="1"/>
  </g>

  <!-- city skyline -->
  <g fill="#070B16">
    <rect x="0" y="230" width="60" height="70"/>
    <rect x="65" y="200" width="45" height="100"/>
    <rect x="115" y="245" width="55" height="55"/>
    <rect x="175" y="215" width="40" height="85"/>
    <rect x="220" y="255" width="65" height="45"/>
    <rect x="850" y="240" width="50" height="60"/>
    <rect x="905" y="210" width="40" height="90"/>
    <rect x="950" y="250" width="50" height="50"/>
    <rect x="800" y="260" width="45" height="40"/>
  </g>
  <g fill="#FBBF24">
    <rect x="20" y="245" width="4" height="4"><animate attributeName="opacity" values="1;0.2;1" dur="2.6s" begin="0.2s" repeatCount="indefinite"/></rect>
    <rect x="35" y="260" width="4" height="4"><animate attributeName="opacity" values="1;0.2;1" dur="3.1s" begin="0.6s" repeatCount="indefinite"/></rect>
    <rect x="78" y="220" width="4" height="4"><animate attributeName="opacity" values="1;0.2;1" dur="2.4s" begin="0.9s" repeatCount="indefinite"/></rect>
    <rect x="188" y="235" width="4" height="4"><animate attributeName="opacity" values="1;0.2;1" dur="2.9s" begin="0.3s" repeatCount="indefinite"/></rect>
    <rect x="865" y="260" width="4" height="4"><animate attributeName="opacity" values="1;0.2;1" dur="2.7s" begin="0.5s" repeatCount="indefinite"/></rect>
    <rect x="918" y="230" width="4" height="4"><animate attributeName="opacity" values="1;0.2;1" dur="3s" begin="1s" repeatCount="indefinite"/></rect>
    <rect x="965" y="265" width="4" height="4"><animate attributeName="opacity" values="1;0.2;1" dur="2.5s" begin="0.7s" repeatCount="indefinite"/></rect>
  </g>

  <!-- swinging web line -->
  <g transform="translate(860,-25)">
    <g>
      <line x1="0" y1="0" x2="0" y2="215" stroke="#CBD5E1" stroke-width="1.1" opacity="0.4"/>
      <circle cx="0" cy="215" r="4.5" fill="#E4212B"/>
      <circle cx="0" cy="215" r="9" fill="none" stroke="#38BDF8" stroke-width="1" opacity="0.55"/>
      <animateTransform attributeName="transform" type="rotate" values="-24 0 0;24 0 0;-24 0 0" dur="4.5s" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- title: comic drop-shadow effect -->
  <text x="504" y="134" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="53" font-weight="800" font-style="italic" fill="#1D4ED8" opacity="0.85">
    Muhammad Galid Avero
  </text>
  <text x="500" y="130" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="53" font-weight="800" font-style="italic" fill="url(#redGrad)" filter="url(#glow)">
    Muhammad Galid Avero
  </text>

  <!-- underline -->
  <rect x="335" y="152" width="330" height="3" rx="1.5" fill="#38BDF8" opacity="0">
    <animate attributeName="opacity" values="0;1" begin="0.6s" dur="0.8s" fill="freeze"/>
  </rect>

  <!-- subtitle -->
  <text x="500" y="190" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="19" font-weight="600" fill="#7DD3FC" opacity="0" filter="url(#glow)">
    Informatics Student  •  Full Stack Developer  •  AI &amp; Data Enthusiast
    <animate attributeName="opacity" values="0;1" begin="1.1s" dur="0.9s" fill="freeze"/>
  </text>

  <!-- tagline -->
  <text x="500" y="218" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-style="italic" fill="#F1F5F9" opacity="0">
    "Friendly neighborhood developer" 🕸️
    <animate attributeName="opacity" values="0;1" begin="1.7s" dur="0.8s" fill="freeze"/>
  </text>

  <!-- terminal line -->
  <text x="500" y="252" text-anchor="middle" font-family="Consolas, Monaco, monospace" font-size="14" fill="#94A3B8" opacity="0">
    &gt; swinging between commits, one push at a time
    <tspan fill="#E4212B">_</tspan>
    <animate attributeName="opacity" values="0;1" begin="2.3s" dur="0.6s" fill="freeze"/>
  </text>
</svg>
