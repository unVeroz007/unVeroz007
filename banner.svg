<svg width="100%" height="280" viewBox="0 0 1000 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B18"/>
      <stop offset="45%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#2E1065"/>
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="50%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#818CF8"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0; 1 0; -1 0" dur="7s" repeatCount="indefinite"/>
    </linearGradient>

    <filter id="blurGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="45"/>
    </filter>
  </defs>

  <rect width="1000" height="280" fill="url(#bgGrad)"/>

  <!-- glow orbs -->
  <circle cx="130" cy="55" r="95" fill="#4F46E5" opacity="0.35" filter="url(#blurGlow)"/>
  <circle cx="880" cy="230" r="120" fill="#7C3AED" opacity="0.30" filter="url(#blurGlow)">
    <animate attributeName="cx" values="880;830;880" dur="10s" repeatCount="indefinite"/>
  </circle>
  <circle cx="500" cy="20" r="70" fill="#3B82F6" opacity="0.20" filter="url(#blurGlow)"/>

  <!-- flowing circuit lines -->
  <path d="M -50 60 L 250 60 L 300 20 L 1050 20" fill="none" stroke="#818CF8" stroke-width="1.5" opacity="0.35" stroke-dasharray="6 10">
    <animate attributeName="stroke-dashoffset" values="0;-160" dur="6s" repeatCount="indefinite"/>
  </path>
  <path d="M -50 240 L 200 240 L 240 260 L 1050 260" fill="none" stroke="#A78BFA" stroke-width="1.5" opacity="0.3" stroke-dasharray="4 12">
    <animate attributeName="stroke-dashoffset" values="0;-180" dur="8s" repeatCount="indefinite"/>
  </path>

  <!-- twinkling stars -->
  <g fill="#C7D2FE">
    <circle cx="80" cy="140" r="1.6"><animate attributeName="opacity" values="0.1;1;0.1" dur="3s" begin="0s" repeatCount="indefinite"/></circle>
    <circle cx="180" cy="90" r="1.3"><animate attributeName="opacity" values="0.1;1;0.1" dur="2.4s" begin="0.4s" repeatCount="indefinite"/></circle>
    <circle cx="920" cy="80" r="1.6"><animate attributeName="opacity" values="0.1;1;0.1" dur="3.2s" begin="0.8s" repeatCount="indefinite"/></circle>
    <circle cx="950" cy="150" r="1.2"><animate attributeName="opacity" values="0.1;1;0.1" dur="2.6s" begin="1.1s" repeatCount="indefinite"/></circle>
    <circle cx="60" cy="220" r="1.4"><animate attributeName="opacity" values="0.1;1;0.1" dur="2.8s" begin="0.6s" repeatCount="indefinite"/></circle>
    <circle cx="70" cy="50" r="1.2"><animate attributeName="opacity" values="0.1;1;0.1" dur="3.4s" begin="1.5s" repeatCount="indefinite"/></circle>
    <circle cx="930" cy="220" r="1.5"><animate attributeName="opacity" values="0.1;1;0.1" dur="2.9s" begin="0.2s" repeatCount="indefinite"/></circle>
  </g>

  <!-- title -->
  <text x="500" y="128" text-anchor="middle" font-family="'Segoe UI', Ubuntu, Arial, sans-serif" font-size="52" font-weight="700" fill="url(#titleGrad)">
    Muhammad Galid Avero
  </text>

  <!-- underline -->
  <rect x="330" y="150" width="340" height="3" rx="1.5" fill="url(#titleGrad)" opacity="0">
    <animate attributeName="opacity" values="0;1" begin="0.6s" dur="0.8s" fill="freeze"/>
  </rect>

  <!-- subtitle -->
  <text x="500" y="188" text-anchor="middle" font-family="'Segoe UI', Ubuntu, Arial, sans-serif" font-size="19" fill="#CBD5E1" opacity="0">
    Informatics Student  •  Full Stack Developer  •  AI &amp; Data Enthusiast
    <animate attributeName="opacity" values="0;1" begin="1.1s" dur="0.9s" fill="freeze"/>
  </text>

  <!-- terminal line -->
  <text x="500" y="228" text-anchor="middle" font-family="Consolas, Monaco, monospace" font-size="14.5" fill="#8B93B0" opacity="0">
    &gt; building the future, one commit at a time
    <tspan fill="#A78BFA">_</tspan>
    <animate attributeName="opacity" values="0;1" begin="1.8s" dur="0.6s" fill="freeze"/>
  </text>
</svg>
